name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage

      - name: Upload coverage to Codecov (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -UseBasicParsing -Uri https://uploader.codecov.io/latest/windows/codecov.exe -OutFile codecov.exe
          .\codecov.exe -t "$env:CODECOV_TOKEN" -f coverage/lcov.info -F frontend

      - name: Upload coverage to Codecov (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          curl -fsSL https://uploader.codecov.io/latest/linux/codecov -o codecov
          chmod +x codecov
          ./codecov -t "$CODECOV_TOKEN" -f coverage/lcov.info -F frontend

      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --runInBand
      
      - name: Upload coverage to Codecov (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -UseBasicParsing -Uri https://uploader.codecov.io/latest/windows/codecov.exe -OutFile codecov.exe
          .\codecov.exe -t "$env:CODECOV_TOKEN" -f coverage/lcov.info -F backend

      - name: Upload coverage to Codecov (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          curl -fsSL https://uploader.codecov.io/latest/linux/codecov -o codecov
          chmod +x codecov
          ./codecov -t "$CODECOV_TOKEN" -f coverage/lcov.info -F backend

      - name: Type check
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present
